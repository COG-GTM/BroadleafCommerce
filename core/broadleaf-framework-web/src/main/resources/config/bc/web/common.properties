web.defaultPageSize=10
web.maxPageSize=100
order.lock.errorInsteadOfQueue=false
order.lock.databaseLockPollingIntervalMs=1000

# Google Analytics Properties - Intentionally left blank as placeholder for client overrides
googleAnalytics.clientId=
googleAnalytics.clientSecret=

googleAnalytics.accountId=
googleAnalytics.webPropertyId=
googleAnalytics.profileId=

googleTagManager.accountId=

# used for multi-site installations only
googleAnalytics.masterWebPropertyId=

# Google analytics 4 tag id for gtag
googleAnalytics4.tagIdForProperty=

# Comma-separated IPs or CIDR blocks of reverse proxies allowed to set X-Forwarded-For for geolocation lookups
# (e.g. 10.0.0.0/8,192.168.1.10). Empty means the header is ignored and the socket address is used.
geolocation.trustedProxies=

# If true, allows products and categories to be retrieved using the ID parameter.    
# This approach can be more efficient for large catalogs and more easily support dynamic URL building
allowProductResolutionUsingIdParam=false
allowCategoryResolutionUsingIdParam=false
